services:
  postgres:
    image: postgres:16
    container_name: cattlesense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cattlesense
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - cattlesense_postgres_data:/var/lib/postgresql/data

volumes:
  cattlesense_postgres_data: